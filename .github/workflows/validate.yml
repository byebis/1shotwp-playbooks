name: validate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Validate registry + signatures
        run: python3 ci/validate.py
  catalog:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Build the /playbooks SEO catalog
        run: python3 ci/build_catalog.py
      - name: Commit the regenerated catalog (GitHub Pages serves docs/)
        run: |
          git config user.name "playbooks-ci"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html
          if git diff --cached --quiet; then
            echo "catalog unchanged"
          else
            git commit -m "catalog: regenerate docs/index.html from registry.json [skip ci]"
            git push
          fi
